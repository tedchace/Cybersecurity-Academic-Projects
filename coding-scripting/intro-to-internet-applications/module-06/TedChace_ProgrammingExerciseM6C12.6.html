<!DOCTYPE html>

<!-- Programming Exercise 12.6 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Exercise 12.6</title>
        <style>
            body {
              padding: 20px;
            }
        
            label {
              margin-right: 10px;
            }
        
            select, button {
              margin: 10px 0;
            }
          </style>
    </head>
    <body>
        <h1>Exercise 12.6</h1>

        <label for="bgColor">Background Color:</label>
        <select id="bgColor">
          <option value="white">White</option>
          <option value="lightblue">Light Blue</option>
          <option value="lightgreen">Light Green</option>
          <option value="lightyellow">Light Yellow</option>
          <option value="lightgray">Light Gray</option>
        </select>
      
        <br>
      
        <label for="fontChoice">Font Style:</label>
        <select id="fontChoice">
          <option value="sans-serif">Sans Serif</option>
          <option value="serif">Serif</option>
        </select>
      
        <br>
      
        <button onclick="applyStyle()">Apply Style</button>
      
        <script>
          function applyStyle() {
            const color = document.getElementById("bgColor").value;
            const font = document.getElementById("fontChoice").value;
      
            document.body.style.backgroundColor = color;
            document.body.style.fontFamily = font;
          }
        </script>
    </body>
</html>
