<!DOCTYPE html>

<!-- Programming Exercise 8.8 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Exercise 8.8</title>
        <style type="text/css">
            table {
                width: 100px;
                border-collapse: collapse;
                background-color: darkgreen;
                margin-bottom: 10px;
            }
            table, td, th {
                border: 1px solid darkgreen;
                padding: 2px;
            }
            th {
                text-align: center;
                color: darkgreen;
                background-color: darkseagreen;
            }
            tr.oddrow {
                background-color: darkseagreen;
            }
        </style>
    </head>
    <body>
        <script>
            var principal = 1000.00;
            var years = 10;
    
            for (var ratePercent = 5; ratePercent <= 10; ratePercent++) {
                var rate = ratePercent / 100;
    
                document.write("<h2>Interest Rate: " + ratePercent + "%</h2>");
                document.write("<table>");
                document.write("<tr><th>Year</th><th>Amount on deposit</th></tr>");
    
                for (var year = 1; year <= years; year++) {
                    var amount = principal * Math.pow(1.0 + rate, year);
                    var rowClass = (year % 2 === 1) ? " class='oddrow'" : "";
                    document.write("<tr" + rowClass + "><td>" + year + "</td><td>$" + amount.toFixed(2) + "</td></tr>");
                }
    
                document.write("</table>");
            }
        </script>
    </body>
</html>
