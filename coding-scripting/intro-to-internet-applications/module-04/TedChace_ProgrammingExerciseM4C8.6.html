<!DOCTYPE html>

<!-- Programming Exercise 8.6 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Exercise 8.6</title>
    </head>
    <body>
        <script>
            let count = parseInt(prompt("How many numbers are there?"));
            if (isNaN(count) || count <= 0) {
                alert("Please enter the nonnegative integers.");
            } else {
                let smallest;
    
                for (let i = 1; i <= count; i++) {
                    let num = parseInt(prompt("Enter nonnegative integer number " + i + ":"));
                    if (isNaN(num) || num < 0) {
                        alert("Invalid input. Please enter a nonnegative integer.");
                        i--;
                        continue;
                    }
                    if (i === 1 || num < smallest) {
                        smallest = num;
                    }
                }
                alert("The smallest nonnegative integer is: " + smallest);
            }
        </script>
    </body>
</html>
