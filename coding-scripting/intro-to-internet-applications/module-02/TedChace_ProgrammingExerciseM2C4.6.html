<!DOCTYPE html>

<!-- Programming Exercise 4.6 -->
<html>
    
    <head>
        <meta charset="utf-8">
        <title>Exercise 4.6</title>

        <!-- CSS Rule -->
        <style>
            .green-Move {
                color: green;
                position: relative;
                top: 25px;
                left: 15px;
            }
        </style>
    </head>

    <!-- classes "blue/red/yellow-Nothing" show relative position which class "green-Move" defers from -->
    <body>
    <p class="blue-Nothing">Programming Exercise 4.6</p>
    <p class="green-Move">Programming Exercise 4.6</p>
    <p class="red-Nothing">Programming Exercise 4.6</p>
    <p class="yellow-Nothing">Programming Exercise 4.6</p>
    </body>

</html>
