<!DOCTYPE html>

<!-- Programming Exercise 5.4 -->
<html>
    
    <head>
        <meta charset="utf-8">
        <title>Exercise 5.4</title>

        <!-- Text Stroke Rule -->
        <style>
            .text-shadow {
            text-shadow: 2px 5px 6px deepskyblue;
        }
            .text-stroke {
            -webkit-text-stroke: 3px navy;
             color: lightblue;
            font-size: 700%;
        }
        </style>
    </head>

    <!-- other classes show relative position which class "text-stroke" defers from -->
    <body>
    <p class="no-shadow">New features in CSS3</p>
    <p class="no-shadow">New features in CSS3</p>
    <p class="text-shadow">New features in CSS3</p>
    <p class="text-stroke">New Webkit features</p>
    </body>

</html>
