<!DOCTYPE html>

<!-- Programming Exercise 14.6 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Exercise 14.6</title>
    </head>
    <body>
        <h2>Exercise 14.6</h2>
        <canvas id="drawRoundedRect" width="250" height="180"
          style = "border: 1px solid black;">
        </canvas>
      
        <script>
          var canvas = document.getElementById("drawRoundedRect");
          var context = canvas.getContext("2d");
      
          function roundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.stroke();
          }
          roundedRect(context, 20, 20, 120, 60, 15);
          roundedRect(context, 60, 100, 100, 50, 20);
        </script>
    </body>
</html>
